name: Validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  data:
    runs-on: ubuntu-latest
    if: github.repository == 'textrefs/textrefs.org'
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Verify data/ pin is on registry main
        run: |
          cd data
          git fetch --unshallow origin main 2>/dev/null || git fetch origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::data/ pointer $(git rev-parse HEAD) is not an ancestor of registry/main"
            exit 1
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run validate:data
