name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      - run: npm run build:data

      - name: List dump artifacts
        run: ls -la dist/dump/

      - name: Attach dump to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/dump/textrefs-*.ndjson.gz
            dist/dump/textrefs-*.manifest.json
          fail_on_unmatched_files: true
          generate_release_notes: true
