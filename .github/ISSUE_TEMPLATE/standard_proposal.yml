name: 📖 Standard proposal (new spec change)
description: Propose a change to the TextRefs specification (stage 1 — proposal).
title: 'standard: '
labels: [standard, 'stage:proposal', triage]
body:
  - type: markdown
    attributes:
      value: |
        Use this for **new** spec proposals. For errata in an already-released spec version, use the "Standard change (erratum)" template instead.

        See the [community governance](https://textrefs.org/community/governance/) and [contributing guide](https://textrefs.org/community/contributing/#review-tracks) for review tracks and escalation.
  - type: input
    id: section
    attributes:
      label: Affected spec section
      placeholder: /standard/specification/ § 6 Work
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: What problem does this solve? Cite real use cases.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Concrete wording or a sketch of the change.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: compat
    attributes:
      label: Compatibility impact
      options:
        - additive (no breaking change)
        - breaking — major version bump required
        - editorial (clarification only)
    validations:
      required: true
  - type: input
    id: target
    attributes:
      label: Target spec version
      placeholder: v0.2.0-draft
    validations:
      required: true
