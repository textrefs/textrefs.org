name: ✨ Feature request
description: Propose a new feature or an enhancement to existing site / tooling behaviour.
title: 'feat: '
labels: [enhancement, triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Motivation
      description: What problem does this solve, or what need does it address? Who is affected?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the feature concretely. Mockups, examples, or links to similar projects help.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Why this approach over others?
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How will we know the feature is done?
    validations:
      required: true
