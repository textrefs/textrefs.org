# lychee link checker config — https://lychee.cli.rs/
# Checks EXTERNAL links in the built site (dist/). Internal links, anchors, and
# i18n are validated at build time by starlight-links-validator, so lychee
# excludes the own domain (its canonical/hreflang/og:url self-links).
# Run in CI via lycheeverse/lychee-action; invoke with --root-dir <abs>/dist
# (lives in the workflow/script since the path is absolute) so any stray
# root-relative /path links resolve locally instead of erroring.

# Caching
cache = true
max_cache_age = "1d"

# Robustness against flaky external hosts
max_retries = 3
retry_wait_time = 2
timeout = 20
max_concurrency = 16

# Treat these as success (some hosts rate-limit or only support range requests)
accept = [200, 206, 429]

# Identify as a real browser; the default agent gets 403'd by some hosts.
user_agent = "Mozilla/5.0 (compatible; lychee/0.x; +https://textrefs.org)"

# Skip schemes lychee cannot verify over HTTP
scheme = ["https", "http"]

# Own domain: canonical/hreflang/og:url self-links — internal links are the
# starlight-links-validator's job, so skip them here.
# Plus known-noisy hosts that block bots / return false negatives.
exclude = [
	"^https?://([a-z0-9-]+\\.)*textrefs\\.org",
	"^https?://([a-z0-9-]+\\.)*linkedin\\.com",
	"^https?://([a-z0-9-]+\\.)*twitter\\.com",
	"^https?://([a-z0-9-]+\\.)*x\\.com",
	"^https?://localhost(:\\d+)?(/|$)",
]

# Don't check mailto: links
include_mail = false
